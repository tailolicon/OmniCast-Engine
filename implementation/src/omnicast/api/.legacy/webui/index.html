.prog > i{ border-radius:999px !important; box-shadow:0 0 10px rgba(59,130,246,0.45); }
.feed-item{ border-bottom:1px solid rgba(0,0,0,0.05) !important; padding:12px 0 !important; }
.feed-dot{ width:9px !important; height:9px !important; box-shadow:0 0 0 4px rgba(0,0,0,0.03); }

/* Office: clay desks + clearer typography */
.office-wrap{ background: radial-gradient(120% 90% at 50% 0%, #fafafe 0%, #f1f2f6 100%); border-radius:24px; padding:8px 4px; }
.ws-name{ font-size:13.5px !important; font-weight:800 !important; letter-spacing:-0.01em; }
.ws-status{ font-size:11px !important; font-weight:600 !important; }
.desk-top{
  background: linear-gradient(160deg,#ffffff,#e9e9ef) !important;
  border-radius:14px !important;
  box-shadow: 5px 6px 14px rgba(0,0,0,0.10), -4px -4px 10px rgba(255,255,255,0.9), inset 0 -3px 6px rgba(0,0,0,0.05) !important;
}
.desk-leg{ background: linear-gradient(180deg,#e4e4ea,#d2d2da) !important; }
.monitor{
  background: linear-gradient(160deg,#f4f4f8,#dcdce4) !important;
  border-radius:10px !important;
  box-shadow: 3px 4px 10px rgba(0,0,0,0.10), inset 1px 1px 2px rgba(255,255,255,0.8), inset -2px -2px 5px rgba(0,0,0,0.06) !important;
  color:#fff;
}
.chair .back{ background: linear-gradient(180deg,#5b5b67,#3c3c46) !important; border-radius:14px 14px 10px 10px !important; }
.chair .seat{ background:#4a4a55 !important; }
.desk-unit::after{
  content:""; position:absolute; bottom:2px; left:50%; transform:translateX(-50%);
  width:78px; height:14px; border-radius:50%;
  background: radial-gradient(ellipse, rgba(0,0,0,0.13), rgba(0,0,0,0) 70%);
  z-index:0; pointer-events:none;
}
.office-legend{ gap:8px !important; }
.leg-item{ background:#ffffff; padding:4px 10px; border-radius:999px; box-shadow:var(--clay-shadow-sm); font-weight:600; }
.ws.error .monitor{ background: linear-gradient(160deg,#7f1d1d,#ef4444) !important; box-shadow:0 5px 16px rgba(239,68,68,0.5) !important; animation: clayPulse 1s ease-in-out infinite; }
@keyframes clayPulse{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-2px); } }
.ws.active .agent{ animation: clayType 0.6s ease-in-out infinite; }
@keyframes clayType{
  0%,100%{ transform: translateX(-50%) translateY(0); }
  50%{ transform: translateX(-50%) translateY(-1.5px); }
}

/* Z-Index Depth Sorting & Masking for Sitting Illusion */
.chair {
  z-index: 5 !important;
  transform: translateX(-50%) translateZ(0) !important;
}
.agent {
  z-index: 4 !important;
  height: 72px !important;
  overflow: hidden !important;
}

/* ============ SPRITE AGENT ANIMATION SYSTEM ============ */
.sprite-agent {
  width: 64px;
  height: 128px;
  background-repeat: no-repeat;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  display: block;
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%) scale(0.95); /* Courier Scale */
  transform-origin: bottom center;
}

/* Seated Agent Scaling & Height Offset (reveals only head/torso) */
.agent .sprite-agent {
  transform: translateX(-50%) scale(0.42) !important; /* Seated Agent Scale */
  bottom: -4px !important; /* Pushes legs below the hidden boundary */
}

.sprite-idle {
  background-image: url('assets/free/64X128_Idle_Free.png');
  background-size: 512px 512px;
  animation: sprite-idle-anim 1.2s steps(8) infinite;
}

.sprite-walk {
  background-image: url('assets/free/64X128_Walking_Free.png');
  background-size: 640px 512px;
  animation: sprite-walk-anim 1.1s steps(10) infinite;
}

.sprite-run {
  background-image: url('assets/free/64X128_Runing_Free.png');
  background-size: 512px 512px;
  animation: sprite-run-anim 0.8s steps(8) infinite;
}

/* Direction Row-Offsets (RPG Maker XP Standard) */
.dir-down  { background-position-y: 0px !important; }
.dir-left  { background-position-y: -128px !important; }
.dir-right { background-position-y: -256px !important; }
.dir-up    { background-position-y: -384px !important; }

/* Dynamic SVG Filters targeting ONLY blue hair (preserves skin and suit) */
.hue-green  { filter: url(#hair-green); }
.hue-blue   { filter: none; }
.hue-red    { filter: url(#hair-red); }
.hue-purple { filter: url(#hair-purple); }
.hue-amber  { filter: url(#hair-amber); }
.hue-gray   { filter: url(#hair-gray); }

@keyframes sprite-idle-anim {
  from { background-position-x: 0px; }
  to { background-position-x: -512px; }
}
@keyframes sprite-walk-anim {
  from { background-position-x: 0px; }
  to { background-position-x: -640px; }
}
@keyframes sprite-run-anim {
  from { background-position-x: 0px; }
  to { background-position-x: -512px; }
}

/* Monitor Screen Scrolling Code Animation */
.ws.active .monitor {
  position: relative;
  overflow: hidden;
  box-shadow: 0 5px 16px rgba(59,130,246,0.45);
}
.ws.active .monitor::before {
  content: "";
  position: absolute;
  inset: 2px;
  background: repeating-linear-gradient(0deg, rgba(0, 255, 0, 0.15) 0px, rgba(0, 255, 0, 0.15) 1px, transparent 1px, transparent 3px);
  animation: monitor-code 2s linear infinite;
  opacity: 0.85;
}
@keyframes monitor-code {
  from { background-position-y: 0px; }
  to { background-position-y: -30px; }
}

/* Elastic Squash-and-Stretch for Trash Bin */
.bin-shake {
  animation: binshake 0.45s ease-in-out forwards !important;
}
@keyframes binshake {
  0% { transform: translateX(-50%) scale(1, 1); }
  15% { transform: translateX(-50%) scale(1.3, 0.7) skewX(-6deg); }
  45% { transform: translateX(-50%) scale(0.8, 1.2) skewX(6deg); }
  70% { transform: translateX(-50%) scale(1.1, 0.9); }
  90% { transform: translateX(-50%) scale(0.96, 1.04); }
  100% { transform: translateX(-50%) scale(1, 1); }
}

/* Curved & Rotating Token Drain Coins */
.token-drain {
  animation: drain-curve 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
}
@keyframes drain-curve {
  0% {
    transform: translate(-50%, 0) scale(0.6) rotate(0deg);
    opacity: 0;
  }
  15% {
    opacity: 1;
    transform: translate(-50%, -12px) scale(1.1) rotate(15deg);
  }
  100% {
    transform: translate(calc(-50% + 22px), -60px) scale(0.75) rotate(-45deg);
    opacity: 0;
  }
}

<script type="text/babel">
const { useState, useEffect } = React;

const NAV = [
  { section: 'Tổng quan', items: [{ id: 'dashboard', label: 'Dashboard', icon: I.dashboard }] },
  { section: 'Sản xuất', items: [
    { id: 'office', label: 'Văn phòng', icon: I.office, badge: { t: '1', c: 'amber' } },
    { id: 'create', label: 'Tạo Video', icon: I.create },
    { id: 'produce', label: 'Sản xuất Video', icon: I.film, badge: { t: '1', c: 'blue' } },
    { id: 'channels', label: 'Kênh', icon: I.channels },
    { id: 'scripts', label: 'Kịch bản', icon: I.scripts },
  ]},
  { section: 'Khám phá', items: [
    { id: 'scanner', label: 'Niche Scanner', icon: I.scanner },
    { id: 'vault', label: 'Niche Vault', icon: I.vault, badge: { t: '2', c: 'red' } },
  ]},
  { section: 'Hệ thống', items: [
    { id: 'scheduler', label: 'Lịch đăng', icon: I.film },
    { id: 'policy', label: 'Chính sách', icon: I.scripts },
    { id: 'monetization', label: 'Monetization', icon: I.coin },
    { id: 'providers', label: 'Providers', icon: I.infra },
    { id: 'infra', label: 'Hạ tầng', icon: I.infra, badge: { t: '1', c: 'red' } },
    { id: 'budget', label: 'Chi phí', icon: I.budget },
  ]},
];

const CRUMB = {
  dashboard: ['Tổng quan', 'Dashboard'], office: ['Sản xuất', 'Văn phòng'],
  create: ['Sản xuất', 'Tạo Video'], produce: ['Sản xuất', 'Sản xuất Video'],
  channels: ['Sản xuất', 'Kênh'], scripts: ['Sản xuất', 'Kịch bản'],
  scanner: ['Khám phá', 'Niche Scanner'], vault: ['Khám phá', 'Niche Vault'],
  scheduler: ['Hệ thống', 'Lịch đăng'], policy: ['Hệ thống', 'Chính sách'], monetization: ['Hệ thống', 'Monetization'], providers: ['Hệ thống', 'Providers'], infra: ['Hệ thống', 'Hạ tầng'], budget: ['Hệ thống', 'Chi phí'],
};

function Sidebar({ tab, setTab, open, onNav }) {
  return (
    <div className={`sidebar ${open ? 'open' : ''}`}>
      <div className="sb-head">
        <div className="sb-logo">O</div>
        <div>
          <div className="sb-brand-name">OmniCast</div>
          <div className="sb-brand-sub">Engine v2</div>
        </div>
      </div>
      <div className="sb-search">
        {I.search}
        <input placeholder="Tìm kiếm..." />
      </div>
      <div className="sb-nav">
        {NAV.map(grp => (
          <div className="sb-section" key={grp.section}>
            <div className="sb-section-label">{grp.section}</div>
            {grp.items.map(it => (
              <button key={it.id} className={`nav-item ${tab === it.id ? 'active' : ''}`} onClick={() => { setTab(it.id); onNav(); }}>
                <span className="ni-icon">{it.icon}</span>
                <span className="ni-label">{it.label}</span>
                {it.badge && <span className={`nav-badge ${it.badge.c}`}>{it.badge.t}</span>}
              </button>
            ))}
          </div>
        ))}
      </div>
      <div className="sb-user">
        <div className="sb-avatar">P</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="sb-user-name">Phạm Đức</div>
          <div className="sb-user-role">Operator · Online</div>
        </div>
        <span style={{ color: 'var(--text3)' }}>{I.bell}</span>
      </div>
    </div>
  );
}

function Scanner() {
  const meta = window.OMNI_NICHE_META || {};
  const list = NICHES || [];
  const threshold = list.filter(n => n.score >= 80).length;
  return (
    <div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}>
        <div>
          <div className="page-title">Niche Scanner</div>
          <div className="page-desc">Quét và chấm điểm niche mới theo thời gian thực</div>
        </div>
        <button className="btn btn-primary" onClick={() => window.OmniActions.discoverNiches()}>{I.bolt} Quét ngay</button>
      </div>
      <div className="grid g4 mb24">
        <div className="kpi"><div className="kpi-label">Kênh đã phân tích</div><div className="kpi-val">{meta.analyzed || 0}</div><div className="kpi-sub">lần quét gần nhất</div></div>
        <div className="kpi"><div className="kpi-label">Niche phát hiện</div><div className="kpi-val text-blue">{list.length}</div><div className="kpi-sub up">trong kho</div></div>
        <div className="kpi"><div className="kpi-label">Đạt ngưỡng</div><div className="kpi-val text-green">{threshold}</div><div className="kpi-sub">score ≥ 80</div></div>
        <div className="kpi"><div className="kpi-label">Quét lúc</div><div className="kpi-val" style={{ fontSize: 15 }}>{meta.scanned_at ? new Date(meta.scanned_at).toLocaleDateString('vi-VN') : '—'}</div></div>
      </div>
      <div className="card">
        <div className="card-hd"><div><div className="card-title">Kết quả scan mới nhất</div><div className="card-sub">Sắp theo score · {list.length} niche</div></div></div>
        {list.length === 0 && <div style={{ padding: 24, textAlign: 'center', color: 'var(--text3)' }}>Chưa có niche. Bấm "Quét ngay" để bắt đầu.</div>}
        {list.map(n => (
          <div key={n.niche_id || n.rank} className="topic-row">
            <div className="topic-main">
              <div className="topic-title">{n.name}</div>
              <div className="topic-sub">{n.market} · {n.cat} · <Icon name="dollar-sign" /> ${n.rpm} RPM · <Icon name="video" /> {n.video}</div>
            </div>
            <span className={`tag ${n.score >= 85 ? 'green' : n.score >= 75 ? 'amber' : 'gray'}`}>{n.score}/100</span>
            <button className="btn btn-primary sm" onClick={() => window.OmniActions.vaultToChannel(n.niche_id)} disabled={!n.niche_id}><Icon name="zap" /> Tạo kênh</button>
          </div>
        ))}
      </div>
    </div>
  );
}

function App({ ver }) {
  const [confirmConfig, setConfirmConfig] = useState(null);
  const getHashTab = () => {
    const match = window.location.hash.match(/#tab=([^&]+)/);
    return match ? match[1] : null;
  };
  const [tab, setTab] = useState(() => {
    return getHashTab() || localStorage.getItem('omnicast_tab') || 'office';
  });
  const [navOpen, setNavOpen] = useState(false);
  const [feed, setFeed] = useState(FEED);

  useEffect(() => {
    window.__omniSetTab = setTab;
    window.__showConfirm = (title, desc, onOk) => {
      setConfirmConfig({ title, desc, onOk });
    };
    const handleHashChange = () => {
      const htab = getHashTab();
      if (htab) setTab(htab);
    };
    window.addEventListener('hashchange', handleHashChange);
    return () => window.removeEventListener('hashchange', handleHashChange);
  }, []);

  useEffect(() => {
    localStorage.setItem('omnicast_tab', tab);
    window.location.hash = `tab=${tab}`;
  }, [tab]);
  // Re-sync the office activity feed whenever live data lands (ver bumps).
  useEffect(() => { if (window.FEED) setFeed(window.FEED); }, [ver]);

  const isOffice = tab === 'office';

  return (
    <div className="app">
      {confirmConfig && (
        <div className="modal-backdrop" onClick={() => setConfirmConfig(null)}>
          <div className="card pad-lg" style={{ maxWidth: 420, width: '90%', background: 'var(--surface)', borderRadius: 'var(--r-md)', boxShadow: 'var(--shadow-lg)' }} onClick={e => e.stopPropagation()}>
            <h3 style={{ marginBottom: 10, fontSize: 16 }}>{confirmConfig.title}</h3>
            <p style={{ color: 'var(--text2)', marginBottom: 20, fontSize: 13.5, lineHeight: 1.5 }}>{confirmConfig.desc}</p>
            <div style={{ display: 'flex', gap: 10, justifyContent: 'flex-end' }}>
              <button className="btn btn-ghost sm" onClick={() => setConfirmConfig(null)}>Hủy</button>
              <button className="btn btn-primary sm" onClick={() => {
                confirmConfig.onOk();
                setConfirmConfig(null);
              }}>Xác nhận</button>
            </div>
          </div>
        </div>
      )}
      <div className={`scrim ${navOpen ? 'show' : ''}`} onClick={() => setNavOpen(false)}></div>
      <Sidebar tab={tab} setTab={setTab} open={navOpen} onNav={() => setNavOpen(false)} />
      <div className="main">
        <div className="topbar">
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <button className="icon-btn hamburger" onClick={() => setNavOpen(true)}>{I.menu}</button>
            <div className="breadcrumb">
              <span>{CRUMB[tab][0]}</span><span className="sep">›</span><b>{CRUMB[tab][1]}</b>
            </div>
          </div>
          <div className="topbar-right">
            {window.OMNI_SYSTEM_STATE && (
              window.OMNI_SYSTEM_STATE.paused ? (
                <button className="pill red" style={{ cursor: 'pointer', border: 'none', font: 'inherit' }} onClick={() => {
                  if (confirm('Chạy lại toàn hệ thống?')) {
                    window.OmniActions.systemResume();
                  }
                }}>
                  <span className="dot"></span>Chạy lại
                </button>
              ) : (
                <button className="pill green" style={{ cursor: 'pointer', border: 'none', font: 'inherit' }} onClick={() => {
                  if (confirm('Tạm dừng toàn hệ thống? Mọi job mới sẽ không chạy.')) {
                    window.OmniActions.systemPause();
                  }
                }}>
                  <span className="dot live"></span>Hệ thống hoạt động
                </button>
              )
            )}
            {window.__omniApiUp === 'red' || window.__omniApiUp === false ? (
              <span className="pill red"><span className="dot"></span>Mất kết nối</span>
            ) : window.__omniApiUp === 'yellow' ? (
              <span className="pill amber"><span className="dot"></span>Đang kết nối lại…</span>
            ) : (
              <span className="pill green"><span className="dot live"></span>Đang chạy</span>
            )}
            <button className="icon-btn">{I.bell}<span className="notif-count">3</span></button>
          </div>
        </div>

        <div className="content-row">
          {/* Office iframe stays MOUNTED across tab switches (hidden via CSS, not
              unmounted) so the pixel office doesn't reload/reset every time. */}
          <div style={{ display: isOffice ? 'flex' : 'none', flex: 1, minWidth: 0, justifyContent: 'center', alignItems: 'center', background: '#09090e', padding: 20 }}>
            {/* Modern Cockpit Frame */}
            <div style={{
              position: 'relative',
              width: '95%',
              maxWidth: 1000,
              aspectRatio: '16/9',
              background: '#121218',
              border: '3px solid var(--blue)',
              borderRadius: 16,
              boxShadow: '0 0 25px rgba(59, 130, 246, 0.45), inset 0 0 15px rgba(59, 130, 246, 0.25)',
              display: 'flex',
              padding: '16px 40px 16px 16px',
              boxSizing: 'border-box'
            }}>
              {/* Internal Monitor Screen */}
              <div style={{ flex: 1, height: '100%', position: 'relative', borderRadius: 8, overflow: 'hidden', border: '1px solid #1e293b' }}>
                {window.PixelOffice ? React.createElement(window.PixelOffice) : <PipelineOffice feed={feed} setFeed={setFeed} />}
              </div>

              {/* Side Cockpit Control Panel */}
              <div style={{
                position: 'absolute',
                top: 0, right: 0, bottom: 0,
                width: 32,
                background: '#1d1d22',
                borderLeft: '2px solid var(--blue)',
                borderTopRightRadius: 12,
                borderBottomRightRadius: 12,
                display: 'flex',
                flexDirection: 'column',
                alignItems: 'center',
                justifyContent: 'space-around',
                padding: '24px 0',
                boxSizing: 'border-box',
                boxShadow: 'inset 3px 0 6px rgba(0,0,0,0.6)'
              }}>
                <div style={{ width: 12, height: 18, background: '#ef4444', borderRadius: 2, border: '1px solid #7f1d1d', cursor: 'pointer', boxShadow: '0 0 6px #ef4444' }} title="POWER"></div>
                <div style={{ width: 12, height: 18, background: '#eab308', borderRadius: 2, border: '1px solid #713f12', cursor: 'pointer', boxShadow: '0 0 6px #eab308' }} title="OVERRIDE"></div>
                <div style={{ width: 12, height: 18, background: '#22c55e', borderRadius: 2, border: '1px solid #14532d', cursor: 'pointer', boxShadow: '0 0 6px #22c55e' }} title="AUTO"></div>
                <div style={{ width: 8, height: 8, background: '#3b82f6', borderRadius: '50%', boxShadow: '0 0 8px #3b82f6' }} title="SIGNAL"></div>
              </div>
            </div>
          </div>
          {!isOffice && (
            <div className="scroll-area">
              {tab === 'dashboard' && <Dashboard />}
              {tab === 'create' && <CreateVideo goProduce={() => setTab('produce')} />}
              {tab === 'produce' && <VideoProduction />}
              {tab === 'channels' && <Channels />}
              {tab === 'scripts' && <Scripts />}
              {tab === 'scanner' && <Scanner />}
              {tab === 'vault' && <NicheVault />}
              {tab === 'scheduler' && <Scheduler />}
              {tab === 'policy' && <Policy />}
              {tab === 'monetization' && <Monetization />}
              {tab === 'providers' && (window.Providers ? React.createElement(window.Providers) : <div>Loading...</div>)}
              {tab === 'infra' && <Infrastructure />}
              {tab === 'budget' && <Budget />}
            </div>
          )}
          {isOffice && <RightPanel feed={feed} />}
        </div>
      </div>
    </div>
  );
}

// Root wrapper: drives live data loading + re-render on change. App re-reads the
// (now mutable) data globals each render, so a bumped `ver` reflects fresh data
// without a full remount (tab state + scroll preserved).
function Root() {
  const [ver, setVer] = useState(0);
  useEffect(() => {
    window.__omniRerender = () => setVer(v => v + 1);
    if (window.OmniLoad) window.OmniLoad();
    if (window.OmniConnectJobEvents) window.OmniConnectJobEvents();
    const t = setInterval(() => { if (window.OmniLoad) window.OmniLoad(); }, 7000);
    return () => clearInterval(t);
  }, []);
  return <App ver={ver} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Root />);
</script>

</body></html>
