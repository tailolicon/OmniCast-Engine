[project]
name = "omnicast-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Core
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",         # PostgreSQL async driver
    # Queue
    "aio-pika>=9.4,<10",        # RabbitMQ async
    # Cache
    "redis>=5.0,<6",            # Redis async
    # Telegram
    "python-telegram-bot>=21,<22",
    # Observability
    "structlog>=24.1,<25",
    # Utils
    "aiofiles>=24.1,<25",          # Async file I/O
    "httpx>=0.27,<1",
    "orjson>=3.10,<4",          # Fast JSON
    # Phase 2: AI Agent Core
    "anthropic>=0.18,<1",       # Claude API
    "openai>=1.40",             # DeepSeek client (OpenAI-compatible endpoint) — llm/deepseek.py
    "yt-dlp>=2025.1",           # stock-video provider (media/providers/stock_video.py)
    "chromadb>=0.5,<1",         # Vector DB for KB
    "tiktoken>=0.7,<1",         # Token counting
    # Phase 3: Topic Discovery
    "pytrends>=4.9,<5",         # Google Trends API
    "praw>=7.7,<8",             # Reddit API
    "feedparser>=6.0,<7",       # RSS feed parsing
    # Phase 4: Media Pipeline
    "kokoro>=0.9,<1",          # TTS primary (local neural, 54 voices)
    "edge-tts>=6.1,<8",        # TTS secondary (cloud neural — KR/VN/DE gaps)
    "soundfile>=0.12,<1",      # Audio I/O
    "numpy>=1.26,<3",          # Audio processing
    "Pillow>=10,<12",          # Image/thumbnail processing
    "imagehash>=4.3,<5",       # Perceptual hashing
    "librosa>=0.10,<1",        # Audio analysis (fingerprint)
    "matplotlib>=3.9,<4",      # Audited finance charts (chart_gen)
    # Phase 5: Upload Pipeline
    "google-auth>=2.29,<3",    # OAuth2
    "google-auth-oauthlib>=1.2,<2",  # OAuth2 consent flow
    "google-api-python-client>=2.130,<3",  # YouTube Data API v3
    "google-genai>=2.0,<3",    # Imagen 4 + Veo image/video generation
    "cloakbrowser>=0.3,<1",   # Stealth browser automation (Gemini web image gen)
    "cryptography>=42,<44",    # Token encryption
    # Phase 6: Dashboard + Alerts
    "streamlit>=1.35,<2",      # Dashboard UI
    "plotly>=5.22,<6",         # Interactive charts
    "streamlit-autorefresh>=1.0,<2",  # Auto-refresh
    # Phase 7: Analytics Loop + Video Intelligence
    "scipy>=1.13,<2",          # Statistical tests (t-test, chi-squared)
    # Orchestration (Kestra-lite pipeline runner + policy watcher schedule)
    "apscheduler>=3.10,<4",    # In-process cron scheduler
    "pyyaml>=6.0,<7",          # Pipeline YAML definitions
]

[project.optional-dependencies]
# Competitor research (analytics.transcript / analytics.competitor_intel).
# These were imported at runtime but never declared, so a fresh environment
# silently lost the capability: no captions, no ASR fallback, and the only
# symptom was a thinner sample that looked like competitors with nothing to say.
competitor-research = [
    "youtube-transcript-api>=0.6,<2",  # captions (primary transcript source)
    "yt-dlp>=2024.1",                  # audio pull for the ASR fallback
    "faster-whisper>=1.0,<2",          # local ASR when captions are absent
]
# Chinese-video reup: Douyin ingest (omnicast.ingest.douyin) + the zh->vi
# translate/dub pipeline (omnicast.reup). Optional because a channel that never
# republishes Douyin content should not pay for the download stack.
reup = [
    "pysubs2>=1.7,<2",       # ASS/SRT read+write for the subtitle layer
    "faster-whisper>=1.1,<2",  # zh ASR
    "aiohttp>=3.9",          # vendored Douyin client transport
    "aiofiles>=23.2.1",      # manifest + media writes
    "aiosqlite>=0.19",       # imported by the vendored storage layer
    "gmssl>=3.2.2",          # SM3 hashing inside a_bogus request signing
    # Vietnamese TTS: 6 shipped voices (Bac/Nam, nam/nu) + reference-audio
    # cloning. 3.x phonemises via the bundled sea_g2p wheel, so unlike the 2.x
    # line it needs no separate eSpeak NG install.
    "vieneu>=3.2,<4",
]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
    "pyright>=1.1,<2",
    "testcontainers[postgres,rabbitmq,redis]>=4,<5",
    "pytest-mock>=3.14,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnicast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
