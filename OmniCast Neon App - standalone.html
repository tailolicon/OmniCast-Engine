  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

position:absolute;color:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.9));animation:twinkle 2.8s infinite;pointer-events:none;z-index:0;}\n  .oc-scroll::-webkit-scrollbar{width:11px;height:11px;}\n  .oc-scroll::-webkit-scrollbar-track{background:rgba(244,95,206,.10);border-radius:999px;margin:4px;}\n  .oc-scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#f45fce,#a877ff);border-radius:999px;border:3px solid transparent;background-clip:padding-box;}\n  .oc-sidebar{width:74px !important;}\n  .oc-sidebar:hover{width:236px !important;}\n  .oc-sidebar .oc-label{opacity:0;max-width:0;overflow:hidden;white-space:nowrap;transition:opacity .14s,max-width .2s;}\n  .oc-sidebar:hover .oc-label{opacity:1;max-width:170px;}\n  .oc-sidebar .oc-eyebrow{opacity:0;height:0;margin-bottom:0 !important;overflow:hidden;transition:opacity .14s;}\n  .oc-sidebar:hover .oc-eyebrow{opacity:1;height:auto;}\n  .oc-sidebar .oc-nav{justify-content:center;gap:0 !important;padding-left:0 !important;padding-right:0 !important;}\n  .oc-sidebar:hover .oc-nav{justify-content:flex-start;gap:11px !important;padding-left:11px !important;padding-right:11px !important;}\n  .oc-sidebar .oc-logo{justify-content:center;padding:0 !important;}\n  .oc-sidebar:hover .oc-logo{justify-content:flex-start;padding:0 16px !important;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"position:relative; width:1440px; height:900px; display:flex; overflow:hidden; font-family:'Be Vietnam Pro',sans-serif; color:#4a3b7a; background:linear-gradient(160deg,#f6f0ff,#e9ddff 42%,#ffe3f4 78%,#e3f4ff);\">\n\n  <!-- sparkle grid overlay -->\n  <div class=\"oc-grid\" style=\"position:absolute; inset:-64px; z-index:0; pointer-events:none; opacity:.45; background-image:linear-gradient(rgba(255,255,255,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.55) 1px,transparent 1px); background-size:64px 64px;\"><\u002Fdiv>\n  <div class=\"star\" style=\"top:80px;left:360px;font-size:20px;\">✦<\u002Fdiv>\n  <div           <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ chShowNiche }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:14px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; background:linear-gradient(160deg,#ffffff,#f7f2ff 65%,#fff2fb); border:2px solid #4a3b7a; border-radius:18px; padding:14px 16px; box-shadow:3px 3px 0 0 rgba(74,59,122,.16), 0 0 24px -8px rgba(168,119,255,.40); flex-wrap:wrap; gap:10px;\">\n                <div><div class=\"disp\" style=\"font-size:14px; font-weight:700; color:#372a66;\">Quét ngách tự động<\u002Fdiv><div style=\"font-size:11px; color:#a390d6;\">Quét xu hướng, lượng tìm kiếm và đề xuất ngách tiềm năng<\u002Fdiv><\u002Fdiv>\n                <button class=\"disp\" style=\"background:linear-gradient(135deg,#f45fce,#a877ff); color:#fff; border:2px solid #4a3b7a; border-radius:999px; padding:8px 16px; font-size:12px; font-weight:700; box-shadow:2px 2px 0 0 rgba(74,59,122,.18); cursor:pointer;\">✧ Chạy quét ngách mới<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n                <sc-for list=\"{{ niches }}\" as=\"n\" hint-placeholder-count=\"4\">\n                  <div style=\"position:relative; overflow:hidden; background:linear-gradient(160deg,#ffffff,#f7f2ff 65%,#fff2fb); border:2px solid #4a3b7a; border-radius:18px; padding:14px 16px; box-shadow:3px 3px 0 0 rgba(74,59,122,.16), 0 0 24px -8px rgba(168,119,255,.40);\">\n                    <span aria-hidden=\"true\" style=\"position:absolute; bottom:-12px; right:-4px; font-size:44px; color:#f1ecff; pointer-events:none;\">✿<\u002Fspan>\n                    <div style=\"position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;\"><span class=\"disp\" style=\"font-size:14px; font-weight:700; color:#372a66;\">{{ n.name }}<\u002Fspan><span style=\"{{ n.badge }}\">{{ n.score }}<\u002Fspan><\u002Fdiv>\n                    <p style=\"margin:0; font-size:12px; color:#8676bd; line-height:1.5;\">{{ n.desc }}<\u002Fp>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ SCHEDULER ══ -->\n      <sc-if value=\"{{ isScheduler }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div><h2 class=\"disp\" style=\"margin:0; font-size:24px; font-weight:800; color:#372a66; text-shadow:0 0 18px rgba(244,95,206,.30);\">Lịch &amp; Tự động <span style=\"font-size:15px; letter-spacing:3px; color:#f45fce; text-shadow:0 0 10px rgba(244,95,206,.65);\">⋆｡˚✧<\u002Fspan><\u002Fh2><p style=\"margin:2px 0 0; font-size:12px; color:#8676bd;\">Cấu hình chu kỳ sản xuất tự động 24/7 và điều hành hàng đợi autopilot<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n            <div style=\"background:linear-gradient(160deg,#ffffff,#fdf4ff 65%,#fff0fa); border:2px solid #4a3b7a; border-radius:20px; padding:18px; box-shadow:3px 3px 0 0 rgba(74,59,122,.18), 0 0 26px -8px rgba(244,95,206,.42);\">\n              <div class=\"disp\" style=\"font-size:15px; font-weight:700; color:#372a66; display:flex; align-items:center; gap:7px;\">{{ autopilotIcon }} Hệ thống Autopilot<\u002Fdiv>\n              <p style=\"font-size:12px; color:#8676bd; line-height:1.6; margin:10px 0 14px;\">Tự động quét ngách, đề xuất chủ đề, tạo kịch bản và render theo chu kỳ mà không cần con người.<\u002Fp>\n              <div style=\"display:flex; align-items:center; justify-content:space-between; padding-top:14px; border-top:1.5px solid #f0e6ff;\">\n                <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:#37b6f5; background:#e6f6ff; border:1.5px solid #4a3b7a; padding:3px 10px; border-radius:999px;\">● ĐANG CHẠY<\u002Fspan>\n                <button class=\"disp\" style=\"background:linear-gradient(135deg,#ff5f9e,#f45fce); color:#fff; border:2px solid #4a3b7a; border-radius:999px; padding:8px 16px; font-size:12px; font-weight:700; box-shadow:2px 2px 0 0 rgba(74,59,122,.18); cursor:pointer;\">Dừng Autopilot<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:linear-gradient(160deg,#ffffff,#fdf4ff 65%,#fff0fa); border:2px solid #4a3b7a; border-radius:20px; padding:18px; box-shadow:3px 3px 0 0 rgba(74,59,122,.18), 0 0 26px -8px rgba(244,95,206,.42);\">\n              <div class=\"disp\" style=\"font-size:15px; font-weight:700; color:#372a66; display:flex; align-items:center; gap:7px;\">{{ schedCalIcon }} Scheduler định kỳ<\u002Fdiv>\n              <p style=\"font-size:12px; color:#8676bd; line-height:1.6; margin:10px 0 14px;\">Bật lịch chạy tự động theo tần suất cấu hình của từng kênh.<\u002Fp>\n              <div style=\"display:flex; align-items:center; justify-content:space-between; padding-top:14px; border-top:1.5px solid #f0e6ff;\">\n                <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:#1a9e7a; background:#e3fff4; border:1.5px solid #4a3b7a; padding:3px 10px; border-radius:999px;\">● ĐÃ BẬT<\u002Fspan>\n                <div style=\"width:52px; height:28px; border-radius:999px; background:#22c9a8; border:2px solid #4a3b7a; position:relative; cursor:pointer;\"><div style=\"position:absolute; top:1px; right:1px; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid #4a3b7a;\"><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:linear-gradient(160deg,#ffffff,#fdf4ff 65%,#fff0fa); border:2px solid #4a3b7a; border-radius:20px; padding:16px; box-shadow:3px 3px 0 0 rgba(74,59,122,.18), 0 0 26px -8px rgba(244,95,206,.42);\">\n            <div class=\"disp\" style=\"font-size:14px; font-weight:700; color:#372a66; margin-bottom:12px;\">Lịch chạy theo kênh<\u002Fdiv>\n            <sc-for list=\"{{ schedule }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1.5px solid #f0e6ff;\">\n                <div style=\"display:flex; align-items:center; gap:10px;\"><span style=\"width:32px;height:32px;border-radius:10px;border:2px solid #4a3b7a;background:{{ s.grad }};\"><\u002Fspan><div><div class=\"disp\" style=\"font-size:13px; font-weight:700; color:#372a66;\">{{ s.name }}<\u002Fdiv><div class=\"mono\" style=\"font-size:10px; color:#b0a3d6;\">{{ s.next }}<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:10px;\"><span class=\"mono\" style=\"font-size:11px; color:#8676bd;\">{{ s.cadence }}<\u002Fspan><span style=\"{{ s.badge }}\">{{ s.state }}<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ APPROVALS ══ -->\n      <sc-if value=\"{{ isApprovals }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div><h2 class=\"disp\" style=\"margin:0; font-size:24px; font-weight:800; color:#372a66; text-shadow:0 0 18px rgba(244,95,206,.30);\">Duyệt &amp; Đăng <span style=\"font-size:15px; letter-spacing:3px; color:#f45fce; text-shadow:0 0 10px rgba(244,95,206,.65);\">⋆｡˚✧<\u002Fspan><\u002Fh2><p style=\"margin:2px 0 0; font-size:12px; color:#8676bd;\">Kiểm tra QC cuối, chọn quyền riêng tư và đích đăng cho từng video<\u002Fp><\u002Fdiv>\n          <sc-for list=\"{{ approvals }}\" as=\"a\" hint-placeholder-count=\"3\">\n            <div style=\"background:linear-gradient(160deg,#ffffff,#fdf4ff 65%,#fff0fa); border:2px solid #4a3b7a; border-radius:20px; padding:14px; box-shadow:3px 3px 0 0 rgba(74,59,122,.18), 0 0 26px -8px rgba(244,95,206,.42); display:flex; gap:14px; align-items:center;\">\n              <div style=\"width:150px; aspect-ratio:16/9; border-radius:12px; border:2px solid #4a3b7a; background:{{ a.grad }}; flex-shrink:0; position:relative; overflow:hidden;\"><span style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; filter:drop-shadow(0 0 5px #fff);\">▶<\u002Fspan><\u002Fdiv>\n              <div style=\"flex:1; min-width:0;\">\n                <div style=\"display:flex; align-items:center; gap:8px; margin-bottom:4px;\"><span class=\"disp\" style=\"font-size:15px; font-weight:700; color:#372a66;\">{{ a.title }}<\u002Fspan><span style=\"{{ a.qc }}\">{{ a.qcText }}<\u002Fspan><\u002Fdiv>\n                <div class=\"mono\" style=\"font-size:11px; color:#a390d6;\">{{ a.channel }} · {{ a.dur }} · {{ a.ago }}<\u002Fdiv>\n                <div style=\"display:flex; gap:7px; margin-top:10px;\">\n                  <button class=\"disp\" style=\"background:linear-gradient(135deg,#22c9a8,#37b6f5); color:#fff; border:2px solid #4a3b7a; border-radius:999px; padding:7px 16px; font-size:12px; font-weight:700; box-shadow:2px 2px 0 0 rgba(74,59,122,.18); cursor:pointer;\">✓ Duyệt &amp; Đăng<\u002Fbutton>\n                  <button class=\"disp\" style=\"background:#fff0f6; color:#ff5f9e; border:2px solid #4a3b7a; border-radius:999px; padding:7px 16px; font-size:12px; font-weight:700; box-shadow:2px 2px 0 0 rgba(74,59,122,.18); cursor:pointer;\">✕ Từ chối<\u002Fbutton>\n                  <button class=\"disp\" style=\"background:#fff; color:#8676bd; border:2px solid #4a3b7a; border-radius:999px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;\">Xem trước<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ ANALYTICS ══ -->\n      <sc-if value=\"{{ isAnalytics }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div><h2 class=\"disp\" style=\"margin:0; font-size:24px; font-weight:800; color:#372a66; text-shadow:0 0 18px rgba(244,95,206,.30);\">Phân tích Hiệu năng <span style=\"font-size:15px; letter-spacing:3px; color:#f45fce; text-shadow:0 0 10px rgba(244,95,206,.65);\">⋆｡˚✧<\u002Fspan><\u002Fh2><p style=\"margin:2px 0 0; font-size:12px; color:#8676bd;\">Theo dõi lượt xem, tương tác và doanh thu chính thức theo từng Video<\u002Fp><\u002Fdiv>\n          <div style=\"background:linear-gradient(160deg,#ffffff,#fdf4ff 65%,#fff0fa); border:2px solid #4a3b7a; border-radius:20px; overflow:hidden; box-shadow:3px 3px 0 0 rgba(74,59,122,.18), 0 0 26px -8px rgba(244,95,206,.42);\">\n            <div style=\"display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr; gap:8px; padding:12px 16px; background:#faf0ff; border-bottom:2px solid #4a3b7a;\">\n              <sc-for list=\"{{ anCols }}\" as=\"c\" hint-placeholder-count=\"6\"><span class=\"disp\" style=\"font-size:10px; font-weight:800; text-transform:uppercase; color:#8676bd;\">{{ c }}<\u002Fspan><\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ analytics }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid; grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr; gap:8px; padding:12px 16px; border-bottom:1.5px solid #f0e6ff; align-items:center;\">\n                <div class=\"disp\" style=\"font-size:12px; font-weight:600; color:#372a66; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ a.title }}<\u002Fdiv>\n                <span style=\"{{ a.plat }}\">{{ a.platform }}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size:11px; color:#4a3b7a;\">{{ a.views }}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size:11px; color:#4a3b7a;\">{{ a.likes }}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size:11px; color:#4a3b7a;\">{{ a.watch }}<\u002Fspan>\n                <span class=\"mono\" style=\"font-size:11px; font-weight:700; color:#1a9e7a;\">{{ a.rev }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ══ LIBRARY ══ -->\n      <sc-if value=\"{{ isLibrary }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div><h2 class=\"disp\" style=\"margin:0; font-size:24px; font-weight:800; color:#372a66; text-shadow:0 0 18px rgba(244,95,206,.30);\">Thư viện <span style=\"font-size:15px; letter-spacing:3px; color:#f45fce; text-shadow:0 0 10px rgba(244,95,206,.65);\">⋆｡˚✧<\u002Fspan><\u002Fh2><p style=\"margin:2px 0 0; font-size:12px; color:#8676bd;\">Tất cả video đã render — xem lại, tải xuống hoặc đăng lại<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:14px;\">\n            <sc-for list=\"{{ library }}\" as=\"v\" hint-placeholder-count=\"6\">\n              <div style=\"background:linear-gradient(160deg,#ffffff,#f7f2ff 65%,#fff2fb); border:2px solid #4a3b7a; border-radius:18px; overflow:hidden; box-shadow:3px 3px 0 0 rgba(74,59,122,.16), 0 0 24px -8px rgba(168,119,255,.40);\">\n                <div style=\"aspect-ratio:16/9; border-bottom:2px solid #4a3b7a; background:{{ v.grad }}; position:relative;\"><span style=\"position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; filter:drop-shadow(0 0 5px #fff);\">▶<\u002Fspan><span class=\"mono\" style=\"position:absolute; bottom:6px; right:6px; background:rgba(74,59,122,.75); color:#fff; font-size:9px; padding:2px 7px; border-radius:999px;\">{{ v.dur }}<\u002Fspan><span style=\"{{ v.qc }}\">{{ v.qcText }}<\u002Fspan><\u002Fdiv>\n                <div style=\"position:relative; overflow:hidden; padding:11px 13px;\"><span aria-hidden=\"true\" style=\"position:
