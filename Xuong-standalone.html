document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

c;border:1px solid #24272e;color:#a4abb8;cursor:pointer;font-size:15px;\">✕<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:18px;\">\n      <div>\n        <div style=\"font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;\">🎙 Giọng đọc &amp; TTS<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center;\"><span style=\"color:#a4abb8;\">Giọng<\u002Fspan><span style=\"color:#eceef2; font-weight:600;\">Ngọc Huyền ▾<\u002Fspan><\u002Fdiv>\n          <div><div style=\"display:flex; justify-content:space-between; font-size:11px; color:#a4abb8; margin-bottom:5px;\"><span>Tốc độ<\u002Fspan><span class=\"mono\" style=\"color:{{ accent }};\">1.0×<\u002Fspan><\u002Fdiv><input type=\"range\" value=\"50\" style=\"width:100%; accent-color:{{ accent }};\"><\u002Fdiv>\n          <div><div style=\"display:flex; justify-content:space-between; font-size:11px; color:#a4abb8; margin-bottom:5px;\"><span>Pitch<\u002Fspan><span class=\"mono\" style=\"color:{{ accent }};\">0<\u002Fspan><\u002Fdiv><input type=\"range\" value=\"50\" style=\"width:100%; accent-color:{{ accent }};\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #24272e; padding-top:16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;\">🖼 Hình ảnh &amp; Style<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between;\"><span style=\"color:#a4abb8;\">Model vẽ<\u002Fspan><span style=\"color:#eceef2; font-weight:600;\">Imagen 4 ▾<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between;\"><span style=\"color:#a4abb8;\">AI Script<\u002Fspan><span style=\"color:#eceef2; font-weight:600;\">Gemini 2.5 ▾<\u002Fspan><\u002Fdiv>\n          <input value=\"cinematic, vintage\" placeholder=\"Ghi đè style…\" style=\"background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:13px; color:#eceef2; font-family:inherit; outline:none;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #24272e; padding-top:16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;\">🎵 Nhạc nền<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:13px; display:flex; justify-content:space-between;\"><span style=\"color:#a4abb8;\">Mood<\u002Fspan><span style=\"color:#eceef2; font-weight:600;\">Calm ▾<\u002Fspan><\u002Fdiv>\n          <div><div style=\"display:flex; justify-content:space-between; font-size:11px; color:#a4abb8; margin-bottom:5px;\"><span>Âm lượng<\u002Fspan><span class=\"mono\" style=\"color:{{ accent }};\">15%<\u002Fspan><\u002Fdiv><input type=\"range\" value=\"30\" style=\"width:100%; accent-color:{{ accent }};\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #24272e; padding-top:16px;\">\n        <div style=\"font-size:11px; font-weight:700; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px;\">📐 Nhịp &amp; Định dạng<\u002Fdiv>\n        <div style=\"display:flex; gap:10px;\">\n          <div style=\"flex:1; display:flex; align-items:center; gap:8px; background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:12px; color:#eceef2;\"><span style=\"width:16px;height:16px;border-radius:4px;border:1px solid #3a3f48;display:inline-block;\"><\u002Fspan>Shorts 9:16<\u002Fdiv>\n          <div style=\"flex:1; display:flex; align-items:center; gap:8px; background:#16181c; border:1px solid #2a2e36; border-radius:9px; padding:10px 12px; font-size:12px; color:#eceef2;\"><span style=\"width:16px;height:16px;border-radius:4px;border:1px solid #3a3f48;display:inline-block;\"><\u002Fspan>Force QC<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:16px 18px; border-top:1px solid #24272e;\">\n      <button onclick=\"{{ closeDrawer }}\" style=\"width:100%; background:{{ accent }}; color:#fff; border:none; border-radius:9px; padding:11px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer;\">Áp dụng cấu hình<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Faside>\n\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#6366f1&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Giao diện&quot;, &quot;options&quot;: [&quot;#6366f1&quot;, &quot;#3b82f6&quot;, &quot;#22c55e&quot;, &quot;#a855f7&quot;]}, &quot;defaultStep&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;render&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Giao diện&quot;, &quot;options&quot;: [&quot;discovery&quot;, &quot;script&quot;, &quot;render&quot;, &quot;duyet&quot;]}}\">\nclass Component extends DCLogic {\n  state = { view: null, drawer: false, chanOpen: false, chanIdx: 0, sceneIdx: 4 };\n\n  renderVals() {\n    const st = this.state;\n    const accent = this.props.accentColor || '#636 ((s, i) => {\n      const done = s.state === 'done', active = s.state === 'active';\n      const sel = i === st.sceneIdx;\n      const dotColor = done ? '#22c55e' : active ? accent : '#3a3f48';\n      const base = 'aspect-ratio:16/9; border-radius:9px; position:relative; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center;';\n      let thumbStyle;\n      if (active) thumbStyle = `${base} background:${s.grad}; border:2px solid ${accent}; box-shadow:0 0 0 3px ${accentSoft};`;\n      else if (done) thumbStyle = `${base} background:${s.grad}; border:${sel ? '2px solid ' + accent : '1px solid #24272e'};`;\n      else thumbStyle = `${base} background:#131519; border:1px dashed #2a2e36;`;\n      const badge = active ? 'ĐANG TẠO…' : 'CHỜ';\n      const badgeStyle = active\n        ? `color:${accent}; font-size:9.5px; font-weight:700;`\n        : 'color:#3a3f48; font-size:9.5px; font-weight:700;';\n      return {\n        ...s, num: '#' + s.n, done, active, sel, dotColor, thumbStyle,\n        showBadge: !done, badge, badgeStyle,\n        titleColor: (done || active) ? '#a4abb8' : '#6b7280',\n      };\n    });\n\n    const sc = raw[st.sceneIdx];\n    const scDone = sc.state === 'done', scActive = sc.state === 'active';\n    const selScene = {\n      num: '#' + sc.n,\n      quote: '\"' + sc.title + '…\"',\n      statusText: scDone ? 'XONG' : scActive ? 'ĐANG TẠO' : 'CHỜ',\n      statusPill: scDone\n        ? 'font-size:10px; font-weight:700; color:#22c55e; background:rgba(34,197,94,.14); padding:3px 8px; border-radius:6px;'\n        : scActive\n        ? `font-size:10px; font-weight:700; color:${accent}; background:${accentSoft}; padding:3px 8px; border-radius:6px;`\n        : 'font-size:10px; font-weight:700; color:#6b7280; background:#16181c; border:1px solid #24272e; padding:3px 8px; border-radius:6px;',\n      detailBg: scDone ? sc.grad : 'linear-gradient(135deg,#1a1f3d,#0c0f1e)',\n      detailNote: scDone ? '' : scActive ? 'Đang dựng ảnh…' : 'Chưa render',\n    };\n\n    const topics = [\n      { rank: '01', title: 'Vì sao biển sâu lại phát sáng?', score: '92' },\n      { rank: '02', title: 'Những con tàu đắm bí ẩn nhất', score: '88' },\n      { rank: '03', title: 'Sự sống quanh miệng núi lửa ngầm', score: '85' },\n      { rank: '04', title: 'Đại dương băng ở Nam Cực', score: '81' },\n      { rank: '05', title: 'Loài sứa bất tử ngoài đời thực', score: '78' },\n    ];\n\n    const logs = [\n      { t: '14:22:07', tag: '[tts]', color: '#22c55e', msg: 'scene_04.mp3 · 1.14s ✓' },\n      { t: '14:22:19', tag: '[image]', color: '#3b82f6', msg: 'imagen4 → scene_05 rendering…' },\n      { t: '14:22:31', tag: '[flow]', color: '#a855f7', msg: 'ghép animation cảnh 5 (1/3)' },\n      { t: '14:22:38', tag: '[music]', color: '#a855f7', msg: 'ocean_calm_02 · mix -18dB' },\n      { t: '14:22:44', tag: '[render]', color: accent, msg: 'progress 62% · ETA 3m10s' },\n    ];\n\n    const history = [\n      { title: 'Tại sao ta ngủ mơ?', dur: '7m 41s', qa: 'PASS', grad: 'linear-gradient(135deg,#2a3552,#141a2b)' },\n      { title: 'Bí mật của giấc ngủ sâu', dur: '9m 12s', qa: 'PASS', grad: 'linear-gradient(135deg,#123a3a,#0a1f22)' },\n      { title: 'Tiếng mưa đêm thư giãn', dur: '10m 05s', qa: 'WARN', grad: 'linear-gradient(135deg,#3a2452,#1a1030)' },\n      { title: 'Hành trình qua dải ngân hà', dur: '8m 33s', qa: 'PASS', grad: 'linear-gradient(135deg,#123049,#08161f)' },\n    ].map(h => ({\n      ...h,\n      qaStyle: h.qa === 'PASS'\n        ? 'font-size:9px; font-weight:700; color:#22c55e; background:rgba(34,197,94,.12); padding:2px 6px; border-radius:5px;'\n        : 'font-size:9px; font-weight:700; color:#f59e0b; background:rgba(245,158,11,.12); padding:2px 6px; border-radius:5px;',\n    }));\n\n    const scriptText = raw.map((s, i) => `[Cảnh ${i + 1}] ${s.title}. Giọng đọc trầm ấm dẫn dắt người xem chìm vào khung cảnh, nhịp chậm rãi để dễ đi vào giấc ngủ.`).join('\\n\\n');\n\n    // step view highlight\n    const stepBase = 'flex:1; display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; transition:background .15s;';\n    const mk = (id, done, first, last) => {\n      const active = view === id;\n      let bg, border;\n      if (active) { bg = accentSoft; border = `1px solid ${accent}`; }\n      else if (done) { bg = 'rgba(34,197,94,.05)'; border = '1px solid rgba(34,197,94,.22)'; }\n      else { bg = '#111316'; border = '1px solid #24272e'; }\n      const radius = first ? 'border-radius:12px 0 0 12px;' : last ? 'border-radius:0 12px 12px 0;' : '';\n      const ring = active ? `box-shadow:0 0 0 3px ${accentSoft};` : '';\n      return `${stepBase} ${first || active ? 'flex:1.25;' : ''} background:${bg}; border:${border}; ${radius} ${ring}`;\n    };\n\n    return {\n      accent, accentSoft,\n      topic: 'Bí ẩn đại dương sâu thẳm',\n      activeChannel, chanList, chanOpen: st.chanOpen,\n      toggleChan: () => this.setState({ chanOpen: !st.chanOpen }),\n      sceneCards: sceneCards.map((c, i) => ({ ...c, onSelect: () => this.setState({ sceneIdx: i }) })),\n      selScene, topics, logs, history, scriptText,\n      viewRender: view === 'render', viewScript: view === 'script',\n      viewDiscovery: view === 'discovery', viewDuyet: view === 'duyet',\n      goDiscovery: () => this.setState({ view: 'discovery' }),\n      goScript: () => this.setState({ view: 'script' }),\n      goRender: () => this.setState({ view: 'render' }),\n      goDuyet: () => this.setState({ view: 'duyet' }),\n      step1Style: mk('discovery', true, true, false),\n      step2Style: mk('script', false, false, false),\n      step3Style: mk('render', false, false, false),\n      step4Style: mk('duyet', false, false, true),\n      progressFill: `width:62%; height:100%; background:linear-gradient(90deg,${accent},${this.lighten(accent)});`,\n      drawer: st.drawer,\n      openDrawer: () => this.setState({ drawer: true }),\n      closeDrawer: () => this.setState({ drawer: false }),\n      drawerStyle: `position:absolute; top:0; right:0; bottom:0; width:400px; background:#0d0f12; border-left:1px solid #24272e; display:flex; flex-direction:column; z-index:50; transform:translateX(${st.drawer ? '0' : '100%'}); transition:transform .28s cubic-bezier(.4,0,.2,1); box-shadow:${st.drawer ? '-20px 0 60px rgba(0,0,0,.5)' : 'none'};`,\n      overlayStyle: `position:absolute; inset:0; background:rgba(0,0,0,.5); z-index:40; transition:opacity .28s; opacity:${st.drawer ? '1' : '0'}; pointer-events:${st.drawer ? 'auto' : 'none'};`,\n    };\n  }\n\n  hexSoft(hex, a) {\n    const h = hex.replace('#', '');\n    const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);\n    return `rgba(${r},${g},${b},${a})`;\n  }\n  lighten(hex) {\n    const h = hex.replace('#', '');\n    let r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);\n    r = Math.min(255, r + 40); g = Math.min(255, g + 40); b = Math.min(255, b + 40);\n    return `rgb(${r},${g},${b})`;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
